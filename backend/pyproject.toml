[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verdant-backend"
version = "0.1.0"
description = "Verdant: Carbon & Latency-Aware Agent Workflow Scheduler"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic[email]>=2.7.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "ortools>=9.10.4067",
    "pyyaml>=6.0.1",
    "sqlmodel>=0.0.19",
    "sse-starlette>=2.1.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.1",
    "anyio>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",  # for TestClient
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
env = [
    "MOCK_LLM=1",
    "USE_SYNTHETIC_CARBON=1",
    "SEED=42",
]

[tool.ruff]
line-length = 100
target-version = "py311"
